<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#F5F5F5"/>
  
  <!-- Left Side (Front) -->
  <g transform="translate(50, 50)">
    <rect width="320" height="400" fill="#FFFFFF" rx="10"/>
    <rect width="320" height="400" fill="#1B365D" rx="10" opacity="0.1"/>
    
    <!-- Header -->
    <text x="20" y="40" font-family="Arial" font-size="24" font-weight="bold" fill="#1B365D">עדן שליחויות אקספרס</text>
    <text x="20" y="70" font-family="Arial" font-size="16" fill="#7FB5FF">מהיר • אמין • עד אליך</text>
    
    <!-- Launch Offer -->
    <g transform="translate(20, 100)">
      <rect width="280" height="100" fill="#FF6B1A" rx="5"/>
      <text x="140" y="30" font-family="Arial" font-size="20" fill="#FFFFFF" text-anchor="middle">מבצע השקה ללקוחות עסקיים!</text>
      <text x="140" y="60" font-family="Arial" font-size="16" fill="#FFFFFF" text-anchor="middle">7 ימי התנסות חינם למסלול העסקי</text>
      <text x="140" y="80" font-family="Arial" font-size="14" fill="#FFFFFF" text-anchor="middle">עד 15 משלוחים • מיועד לעסקים</text>
    </g>
    
    <!-- Features -->
    <g transform="translate(20, 220)">
      <rect width="280" height="120" fill="#7FB5FF" rx="5" opacity="0.1"/>
      <text x="10" y="30" font-family="Arial" font-size="14" fill="#1B365D">✓ מעקב GPS בזמן אמת</text>
      <text x="10" y="60" font-family="Arial" font-size="14" fill="#1B365D">✓ תמיכת WhatsApp 24/6</text>
      <text x="10" y="90" font-family="Arial" font-size="14" fill="#1B365D">✓ אחריות מלאה</text>
    </g>
    
    <!-- QR Code -->
    <rect x="220" y="300" width="80" height="80" fill="#1B365D"/>
    <text x="220" y="390" font-family="Arial" font-size="12" fill="#1B365D">סרקו להתנסות חינם</text>
  </g>
  
  <!-- Right Side (Back) -->
  <g transform="translate(430, 50)">
    <rect width="320" height="400" fill="#FFFFFF" rx="10"/>
    
    <!-- Business Plans -->
    <g transform="translate(20, 20)">
      <text x="0" y="30" font-family="Arial" font-size="18" font-weight="bold" fill="#1B365D">חבילות עסקיות חודשיות</text>
      
      <!-- Plans Table -->
      <g transform="translate(0, 50)">
        <rect width="280" height="200" fill="#F5F5F5" rx="5"/>
        <text x="10" y="30" font-family="Arial" font-size="16" fill="#1B365D">בייסיק: 1,200₪ (30 משלוחים)</text>
        <text x="10" y="80" font-family="Arial" font-size="16" fill="#1B365D">ביזנס: 2,100₪ (60 משלוחים)</text>
        <text x="10" y="130" font-family="Arial" font-size="16" fill="#1B365D">פרימיום: 3,000₪ (100 משלוחים)</text>
      </g>
    </g>
    
    <!-- Single Deliveries -->
    <g transform="translate(20, 280)">
      <text x="0" y="0" font-family="Arial" font-size="16" font-weight="bold" fill="#1B365D">משלוח בודד</text>
      <text x="0" y="30" font-family="Arial" font-size="14" fill="#1B365D">ת"א: 45₪ | גוש דן: 55₪</text>
      <text x="0" y="50" font-family="Arial" font-size="14" fill="#1B365D">שירות אקספרס: תוספת 20₪</text>
    </g>
    
    <!-- Contact -->
    <text x="20" y="350" font-family="Arial" font-size="14" fill="#1B365D">טלפון: 053-590-9043</text>
  </g>
</svg>