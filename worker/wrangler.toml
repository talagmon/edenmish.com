name = "edenmish-ops"
main = "src/index.js"
compatibility_date = "2024-11-01"

# account_id is read from CLOUDFLARE_ACCOUNT_ID env (do not hardcode here)

# Branded subdomains (custom domains — bare hostnames, Cloudflare manages DNS)
routes = [
  { pattern = "find.edenmish.com", custom_domain = true },
  { pattern = "ops.edenmish.com", custom_domain = true }
]

[triggers]
crons = ["*/5 * * * *", "17 2 * * *"]

[vars]
BRAND = "EdenMish"
BOOKING_URL = "https://edenmish.com"
# Customer-facing storefront root used for every link the Worker emits
# (tracking magic-links, delivery/rating emails, ops dash deeplink). Apex cutover
# complete — edenmish.com is the canonical site. Falls back to BOOKING_URL if unset.
STOREFRONT_BASE = "https://edenmish.com"
# MAPS_KEY is a browser-restricted Worker secret injected into the tracking page.
# GOOGLE_PLACES_SERVER_KEY is a separate API-restricted server key used only for
# authenticated business batch address validation.
WHATSAPP_NUMBER = "972534058498"
OPS_EMAIL = "eden@edenmish.com"
EMAIL_FROM_ADDRESS = "no-reply@edenmish.com"
EMAIL_FROM_NAME = "EdenMish"
EMAIL_RECIPIENT_POLICY = "open"
AUTO_DRIVER_DISPATCH = "on"
ROUTE_OPTIMIZATION_PROVIDER = "google"
GOOGLE_ROUTE_OPTIMIZATION_PROJECT_ID = "gen-lang-client-0008834106"
SHOPIFY_SHOP = "edenmish.myshopify.com"
SHOPIFY_API_VERSION = "2026-04"
BUSINESS_BATCH_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
ALLOWED_ORIGINS = "https://edenmish.com,https://www.edenmish.com,https://v2.edenmish.com,https://track.edenmish.com,https://dash.edenmish.com,https://edenmish-v2.pages.dev"

[ai]
binding = "AI"

# D1 database
[[d1_databases]]
binding = "DB"
database_name = "edenmish"
database_id = "f2f51b54-0170-4594-a41c-7a6037c902aa"

# Secrets (set with `wrangler secret put`): OPS_PIN, SESSION_SECRET, MAPS_KEY,
#   GOOGLE_PLACES_SERVER_KEY,
#   SHOPIFY_ADMIN_TOKEN (shpat_...), SHOPIFY_WEBHOOK_SECRET,
#   RESEND_API_KEY (or SENDGRID_API_KEY),
#   GREENINVOICE_API_KEY, GREENINVOICE_SECRET_KEY,
#   GOOGLE_ROUTE_OPTIMIZATION_SERVICE_ACCOUNT_JSON (only when route optimization is enabled).
# Optional WhatsApp Cloud API secrets (see docs/WHATSAPP_OPERATIONS.md):
#   WHATSAPP_PHONE_ID, WHATSAPP_TOKEN, WHATSAPP_APP_SECRET,
#   WHATSAPP_WEBHOOK_VERIFY_TOKEN, WHATSAPP_OPS_RECIPIENT,
#   WHATSAPP_OPS_PAYMENT_TEMPLATE, WHATSAPP_OPS_TEMPLATE_LANGUAGE,
#   WHATSAPP_CUSTOMER_DELIVERED_TEMPLATE,
#   WHATSAPP_CUSTOMER_TEMPLATE_LANGUAGE.
# Optional for future Mesh/J5 pre-auth: PAYMENT_MODE=preauth, MESH_API_KEY.
