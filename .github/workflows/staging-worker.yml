name: Staging Worker

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'worker/**'
      - '.github/workflows/staging-worker.yml'

permissions:
  contents: read

concurrency:
  group: staging-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Test and deploy isolated staging Worker
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_D1_DATABASE_ID: ${{ vars.STAGING_D1_DATABASE_ID }}
      STAGING_OPS_PIN: ${{ secrets.STAGING_OPS_PIN }}
      STAGING_SESSION_SECRET: ${{ secrets.STAGING_SESSION_SECRET }}
      STAGING_DRIVER_ONE_TIME_CODE: ${{ secrets.STAGING_DRIVER_ONE_TIME_CODE }}
      STAGING_GOOGLE_ROUTE_OPTIMIZATION_SERVICE_ACCOUNT_JSON: ${{ secrets.STAGING_GOOGLE_ROUTE_OPTIMIZATION_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate staging configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$STAGING_D1_DATABASE_ID" || { echo "::error::Missing STAGING_D1_DATABASE_ID environment variable"; exit 1; }
          test -n "$STAGING_OPS_PIN" || { echo "::error::Missing STAGING_OPS_PIN"; exit 1; }
          test -n "$STAGING_SESSION_SECRET" || { echo "::error::Missing STAGING_SESSION_SECRET"; exit 1; }
          test -n "$STAGING_DRIVER_ONE_TIME_CODE" || { echo "::error::Missing STAGING_DRIVER_ONE_TIME_CODE"; exit 1; }
          test -n "$STAGING_GOOGLE_ROUTE_OPTIMIZATION_SERVICE_ACCOUNT_JSON" || { echo "::error::Missing STAGING_GOOGLE_ROUTE_OPTIMIZATION_SERVICE_ACCOUNT_JSON"; exit 1; }
      - name: Install and test Worker
        working-directory: worker
        run: npm ci && npm test
      - name: Render isolated staging configuration
        working-directory: worker
        run: node scripts/render-staging-config.mjs
      - name: Apply staging driver proof migration
        working-directory: worker
        run: >-
          npx wrangler d1 execute edenmish-staging --remote --yes
          --config wrangler.staging.generated.toml
          --file=./migrations/017_driver_task_proofs.sql
      - name: Apply staging business wallet migration when needed
        working-directory: worker
        run: |
          readiness_json="$(npx wrangler d1 execute edenmish-staging --remote --yes --json \
            --config wrangler.staging.generated.toml \
            --command "SELECT COUNT(*) AS ready FROM pragma_table_info('orders') WHERE name IN ('business_account_id','wallet_reservation_id','payment_method')")"
          ready="$(printf '%s' "$readiness_json" | jq -r '.[0].results[0].ready')"
          if [ "$ready" = "0" ]; then
            npx wrangler d1 execute edenmish-staging --remote --yes \
              --config wrangler.staging.generated.toml \
              --file=./migrations/018_business_wallet.sql
          elif [ "$ready" != "3" ]; then
            echo "::error::Business wallet migration is only partially applied ($ready/3 order columns)."
            exit 1
          else
            echo "Business wallet migration 018 is already applied."
          fi
      - name: Repair partially applied staging business wallet schema
        working-directory: worker
        run: >-
          npx wrangler d1 execute edenmish-staging --remote --yes
          --config wrangler.staging.generated.toml
          --file=./migrations/020_business_wallet_schema_repair.sql
      - name: Apply staging business entry plans migration when needed
        working-directory: worker
        run: |
          readiness_json="$(npx wrangler d1 execute edenmish-staging --remote --yes --json \
            --config wrangler.staging.generated.toml \
            --command "SELECT COUNT(*) AS ready FROM sqlite_master WHERE type='table' AND name IN ('business_accounts','wallet_topups','business_plan_enrollments') AND sql LIKE '%''trial''%' AND sql LIKE '%''wallet''%'")"
          ready="$(printf '%s' "$readiness_json" | jq -r '.[0].results[0].ready')"
          if [ "$ready" = "0" ]; then
            npx wrangler d1 execute edenmish-staging --remote --yes \
              --config wrangler.staging.generated.toml \
              --file=./migrations/021_business_entry_plans.sql
          elif [ "$ready" != "3" ]; then
            echo "::error::Business entry plans migration is only partially applied ($ready/3 constrained tables)."
            exit 1
          else
            echo "Business entry plans migration 021 is already applied."
          fi
      - name: Apply staging business-plan coupons migration when needed
        working-directory: worker
        run: |
          readiness_json="$(npx wrangler d1 execute edenmish-staging --remote --yes --json \
            --config wrangler.staging.generated.toml \
            --command "SELECT (SELECT COUNT(*) FROM pragma_table_info('coupons') WHERE name IN ('scope','business_plan_ids')) + (SELECT COUNT(*) FROM pragma_table_info('wallet_topups') WHERE name IN ('payment_amount_agorot','discount_code','discount_amount_agorot','discount_title')) + (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='business_coupon_redemptions') AS ready")"
          ready="$(printf '%s' "$readiness_json" | jq -r '.[0].results[0].ready')"
          if [ "$ready" = "0" ]; then
            npx wrangler d1 execute edenmish-staging --remote --yes \
              --config wrangler.staging.generated.toml \
              --file=./migrations/022_business_plan_coupons.sql
          elif [ "$ready" != "7" ]; then
            echo "::error::Business-plan coupons migration is only partially applied ($ready/7 schema items)."
            exit 1
          else
            echo "Business-plan coupons migration 022 is already applied."
          fi
      - name: Apply staging delivery notification outbox migration
        working-directory: worker
        run: >-
          npx wrangler d1 execute edenmish-staging --remote --yes
          --config wrangler.staging.generated.toml
          --file=./migrations/019_delivery_notification_outbox.sql
      - name: Apply staging driver login invitations migration
        working-directory: worker
        run: >-
          npx wrangler d1 execute edenmish-staging --remote --yes
          --config wrangler.staging.generated.toml
          --file=./migrations/023_driver_login_invitations.sql
      - name: Apply staging phone delivery-link consent migration
        working-directory: worker
        run: |
          readiness_json="$(npx wrangler d1 execute edenmish-staging --remote --yes --json \
            --config wrangler.staging.generated.toml \
            --command "SELECT COUNT(*) AS ready FROM pragma_table_info('orders') WHERE name IN ('phone_delivery_link_opt_in','phone_delivery_link_opt_in_at')")"
          ready="$(printf '%s' "$readiness_json" | jq -r '.[0].results[0].ready')"
          if [ "$ready" = "0" ]; then
            npx wrangler d1 execute edenmish-staging --remote --yes \
              --config wrangler.staging.generated.toml \
              --file=./migrations/024_phone_delivery_link_consent.sql
          elif [ "$ready" != "2" ]; then
            echo "::error::Phone delivery-link consent migration is only partially applied ($ready/2 columns)."
            exit 1
          else
            echo "Phone delivery-link consent migration 024 is already applied."
          fi
      - name: Apply staging retained-package migration when needed
        working-directory: worker
        run: |
          readiness_json="$(npx wrangler d1 execute edenmish-staging --remote --yes --json \
            --config wrangler.staging.generated.toml \
            --command "SELECT (SELECT COUNT(*) FROM pragma_table_info('orders') WHERE name IN ('retained_by_driver','retained_at')) + (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name='idx_orders_retained_by_driver') AS ready")"
          ready="$(printf '%s' "$readiness_json" | jq -r '.[0].results[0].ready')"
          if [ "$ready" = "0" ]; then
            npx wrangler d1 execute edenmish-staging --remote --yes \
              --config wrangler.staging.generated.toml \
              --file=./migrations/025_delivery_failure_retained_package.sql
          elif [ "$ready" != "3" ]; then
            echo "::error::Retained-package migration is only partially applied ($ready/3 schema items)."
            exit 1
          else
            echo "Retained-package migration 025 is already applied."
          fi
      - name: Apply staging pending-redelivery migration when needed
        working-directory: worker
        run: |
          readiness_json="$(npx wrangler d1 execute edenmish-staging --remote --yes --json \
            --config wrangler.staging.generated.toml \
            --command "SELECT COUNT(*) AS ready FROM pragma_table_info('orders') WHERE name='pending_redelivery_json'")"
          ready="$(printf '%s' "$readiness_json" | jq -r '.[0].results[0].ready')"
          if [ "$ready" = "0" ]; then
            npx wrangler d1 execute edenmish-staging --remote --yes \
              --config wrangler.staging.generated.toml \
              --file=./migrations/026_redelivery_pending_address.sql
          elif [ "$ready" != "1" ]; then
            echo "::error::Pending-redelivery migration returned an invalid readiness count ($ready)."
            exit 1
          else
            echo "Pending-redelivery migration 026 is already applied."
          fi
      - name: Apply staging retained-failure notification migration when needed
        working-directory: worker
        run: |
          readiness_json="$(npx wrangler d1 execute edenmish-staging --remote --yes --json \
            --config wrangler.staging.generated.toml \
            --command "SELECT CASE WHEN sql LIKE '%delivery_failed_retained%' THEN 1 ELSE 0 END AS ready FROM sqlite_master WHERE type='table' AND name='delivery_notification_outbox'")"
          ready="$(printf '%s' "$readiness_json" | jq -r '.[0].results[0].ready // 0')"
          if [ "$ready" = "0" ]; then
            npx wrangler d1 execute edenmish-staging --remote --yes \
              --config wrangler.staging.generated.toml \
              --file=./migrations/027_retained_failure_notifications.sql
          elif [ "$ready" != "1" ]; then
            echo "::error::Retained-failure notification migration returned an invalid readiness value ($ready)."
            exit 1
          else
            echo "Retained-failure notification migration 027 is already applied."
          fi
      - name: Apply staging redelivery charge migration when needed
        working-directory: worker
        run: |
          readiness_json="$(npx wrangler d1 execute edenmish-staging --remote --yes --json \
            --config wrangler.staging.generated.toml \
            --command "SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='redelivery_charges') + (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name='idx_redelivery_charges_status') + (SELECT COUNT(*) FROM pragma_table_info('redelivery_charges') WHERE name='address_snapshot_json') AS ready")"
          ready="$(printf '%s' "$readiness_json" | jq -r '.[0].results[0].ready // 0')"
          if [ "$ready" = "0" ]; then
            npx wrangler d1 execute edenmish-staging --remote --yes \
              --config wrangler.staging.generated.toml \
              --file=./migrations/028_redelivery_charges.sql
          elif [ "$ready" != "3" ]; then
            echo "::error::Redelivery charge migration is only partially applied ($ready/3 schema items)."
            exit 1
          else
            echo "Redelivery charge migration 028 is already applied."
          fi
      - name: Enforce staging wallet reservation ownership
        working-directory: worker
        run: |
          duplicate_json="$(npx wrangler d1 execute edenmish-staging --remote --yes --json \
            --config wrangler.staging.generated.toml \
            --command "SELECT COUNT(*) AS duplicate_count FROM (SELECT wallet_reservation_id FROM orders WHERE wallet_reservation_id IS NOT NULL GROUP BY wallet_reservation_id HAVING COUNT(*) > 1)")"
          duplicate_count="$(printf '%s' "$duplicate_json" | jq -r '.[0].results[0].duplicate_count')"
          if [ "$duplicate_count" != "0" ]; then
            echo "::error::Found $duplicate_count wallet reservation references shared by multiple orders. Review them before migration 029."
            exit 1
          fi
          readiness_json="$(npx wrangler d1 execute edenmish-staging --remote --yes --json \
            --config wrangler.staging.generated.toml \
            --command "SELECT COUNT(*) AS ready FROM sqlite_master WHERE type='index' AND name='idx_orders_wallet_reservation_unique'")"
          ready="$(printf '%s' "$readiness_json" | jq -r '.[0].results[0].ready')"
          if [ "$ready" = "0" ]; then
            npx wrangler d1 execute edenmish-staging --remote --yes \
              --config wrangler.staging.generated.toml \
              --file=./migrations/029_wallet_reservation_ownership.sql
          elif [ "$ready" != "1" ]; then
            echo "::error::Unexpected wallet reservation ownership index state ($ready)."
            exit 1
          else
            echo "Wallet reservation ownership migration 029 is already applied."
          fi
      - name: Verify remote driver schema readiness
        working-directory: worker
        run: node scripts/validate-driver-schema.mjs --database edenmish-staging --config wrangler.staging.generated.toml
      - name: Verify remote business wallet schema readiness
        working-directory: worker
        run: |
          readiness_json="$(npx wrangler d1 execute edenmish-staging --remote --yes --json \
            --config wrangler.staging.generated.toml \
            --command "SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('business_users','business_accounts','business_members','business_auth_challenges','business_sessions','business_wallets','wallet_topups','wallet_credit_lots','wallet_reservations','wallet_entries','business_plan_enrollments','business_coupon_redemptions')) AS tables, (SELECT COUNT(*) FROM pragma_table_info('orders') WHERE name IN ('business_account_id','wallet_reservation_id','payment_method')) AS columns, (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('business_accounts','wallet_topups','business_plan_enrollments') AND sql LIKE '%''trial''%' AND sql LIKE '%''wallet''%') AS plans, (SELECT COUNT(*) FROM pragma_table_info('coupons') WHERE name IN ('scope','business_plan_ids')) + (SELECT COUNT(*) FROM pragma_table_info('wallet_topups') WHERE name IN ('payment_amount_agorot','discount_code','discount_amount_agorot','discount_title')) AS coupon_columns, (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name='idx_orders_wallet_reservation_unique') AS ownership_index")"
          printf '%s' "$readiness_json" | jq -e '.[0].results[0] | .tables == 12 and .columns == 3 and .plans == 3 and .coupon_columns == 6 and .ownership_index == 1'
      - name: Prepare staging secrets
        run: |
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync("/tmp/edenmish-staging-secrets.json", JSON.stringify({ OPS_PIN: process.env.STAGING_OPS_PIN, SESSION_SECRET: process.env.STAGING_SESSION_SECRET, DRIVER_ONE_TIME_CODE: process.env.STAGING_DRIVER_ONE_TIME_CODE, GOOGLE_ROUTE_OPTIMIZATION_SERVICE_ACCOUNT_JSON: process.env.STAGING_GOOGLE_ROUTE_OPTIMIZATION_SERVICE_ACCOUNT_JSON }), { mode: 0o600 });'
      - name: Deploy staging Worker
        working-directory: worker
        run: npx wrangler deploy --config wrangler.staging.generated.toml --secrets-file /tmp/edenmish-staging-secrets.json
      - name: Remove temporary secret file
        if: always()
        run: rm -f /tmp/edenmish-staging-secrets.json
      - name: Verify staging Worker and CORS
        run: |
          ready=0
          for attempt in {1..12}; do
            if curl --fail --silent --show-error https://ops-staging.edenmish.com/health; then
              ready=1
              break
            fi
            echo "Waiting for staging custom domain (attempt $attempt/12)..."
            sleep 5
          done
          test "$ready" = "1" || { echo "::error::Staging Worker health check failed"; exit 1; }
          curl --fail --silent --show-error \
            -H 'Origin: https://staging.edenmish.com' \
            -D /tmp/staging-headers.txt \
            https://ops-staging.edenmish.com/health >/dev/null
          grep -qi '^access-control-allow-origin: https://staging.edenmish.com' /tmp/staging-headers.txt
