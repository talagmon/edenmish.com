name: Staging Worker

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'worker/**'
      - '.github/workflows/staging-worker.yml'

permissions:
  contents: read

concurrency:
  group: staging-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Test and deploy isolated staging Worker
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_D1_DATABASE_ID: ${{ vars.STAGING_D1_DATABASE_ID }}
      STAGING_OPS_PIN: ${{ secrets.STAGING_OPS_PIN }}
      STAGING_SESSION_SECRET: ${{ secrets.STAGING_SESSION_SECRET }}
      STAGING_DRIVER_ONE_TIME_CODE: ${{ secrets.STAGING_DRIVER_ONE_TIME_CODE }}
      STAGING_GOOGLE_ROUTE_OPTIMIZATION_SERVICE_ACCOUNT_JSON: ${{ secrets.STAGING_GOOGLE_ROUTE_OPTIMIZATION_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate staging configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$STAGING_D1_DATABASE_ID" || { echo "::error::Missing STAGING_D1_DATABASE_ID environment variable"; exit 1; }
          test -n "$STAGING_OPS_PIN" || { echo "::error::Missing STAGING_OPS_PIN"; exit 1; }
          test -n "$STAGING_SESSION_SECRET" || { echo "::error::Missing STAGING_SESSION_SECRET"; exit 1; }
          test -n "$STAGING_DRIVER_ONE_TIME_CODE" || { echo "::error::Missing STAGING_DRIVER_ONE_TIME_CODE"; exit 1; }
          test -n "$STAGING_GOOGLE_ROUTE_OPTIMIZATION_SERVICE_ACCOUNT_JSON" || { echo "::error::Missing STAGING_GOOGLE_ROUTE_OPTIMIZATION_SERVICE_ACCOUNT_JSON"; exit 1; }
      - name: Install and test Worker
        working-directory: worker
        run: npm ci && npm test
      - name: Render isolated staging configuration
        working-directory: worker
        run: node scripts/render-staging-config.mjs
      - name: Apply staging driver proof migration
        working-directory: worker
        run: >-
          npx wrangler d1 execute edenmish-staging --remote --yes
          --config wrangler.staging.generated.toml
          --file=./migrations/017_driver_task_proofs.sql
      - name: Apply staging business wallet migration when needed
        working-directory: worker
        run: |
          readiness_json="$(npx wrangler d1 execute edenmish-staging --remote --yes --json \
            --config wrangler.staging.generated.toml \
            --command "SELECT COUNT(*) AS ready FROM pragma_table_info('orders') WHERE name IN ('business_account_id','wallet_reservation_id','payment_method')")"
          ready="$(printf '%s' "$readiness_json" | jq -r '.[0].results[0].ready')"
          if [ "$ready" = "0" ]; then
            npx wrangler d1 execute edenmish-staging --remote --yes \
              --config wrangler.staging.generated.toml \
              --file=./migrations/018_business_wallet.sql
          elif [ "$ready" != "3" ]; then
            echo "::error::Business wallet migration is only partially applied ($ready/3 order columns)."
            exit 1
          else
            echo "Business wallet migration 018 is already applied."
          fi
      - name: Apply staging delivery notification outbox migration
        working-directory: worker
        run: >-
          npx wrangler d1 execute edenmish-staging --remote --yes
          --config wrangler.staging.generated.toml
          --file=./migrations/019_delivery_notification_outbox.sql
      - name: Verify remote driver schema readiness
        working-directory: worker
        run: node scripts/validate-driver-schema.mjs --database edenmish-staging --config wrangler.staging.generated.toml
      - name: Verify remote business wallet schema readiness
        working-directory: worker
        run: |
          readiness_json="$(npx wrangler d1 execute edenmish-staging --remote --yes --json \
            --config wrangler.staging.generated.toml \
            --command "SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('business_users','business_accounts','business_members','business_auth_challenges','business_sessions','business_wallets','wallet_topups','wallet_credit_lots','wallet_reservations','wallet_entries','business_plan_enrollments')) AS tables, (SELECT COUNT(*) FROM pragma_table_info('orders') WHERE name IN ('business_account_id','wallet_reservation_id','payment_method')) AS columns")"
          printf '%s' "$readiness_json" | jq -e '.[0].results[0] | .tables == 11 and .columns == 3'
      - name: Prepare staging secrets
        run: |
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync("/tmp/edenmish-staging-secrets.json", JSON.stringify({ OPS_PIN: process.env.STAGING_OPS_PIN, SESSION_SECRET: process.env.STAGING_SESSION_SECRET, DRIVER_ONE_TIME_CODE: process.env.STAGING_DRIVER_ONE_TIME_CODE, GOOGLE_ROUTE_OPTIMIZATION_SERVICE_ACCOUNT_JSON: process.env.STAGING_GOOGLE_ROUTE_OPTIMIZATION_SERVICE_ACCOUNT_JSON }), { mode: 0o600 });'
      - name: Deploy staging Worker
        working-directory: worker
        run: npx wrangler deploy --config wrangler.staging.generated.toml --secrets-file /tmp/edenmish-staging-secrets.json
      - name: Remove temporary secret file
        if: always()
        run: rm -f /tmp/edenmish-staging-secrets.json
      - name: Verify staging Worker and CORS
        run: |
          ready=0
          for attempt in {1..12}; do
            if curl --fail --silent --show-error https://ops-staging.edenmish.com/health; then
              ready=1
              break
            fi
            echo "Waiting for staging custom domain (attempt $attempt/12)..."
            sleep 5
          done
          test "$ready" = "1" || { echo "::error::Staging Worker health check failed"; exit 1; }
          curl --fail --silent --show-error \
            -H 'Origin: https://staging.edenmish.com' \
            -D /tmp/staging-headers.txt \
            https://ops-staging.edenmish.com/health >/dev/null
          grep -qi '^access-control-allow-origin: https://staging.edenmish.com' /tmp/staging-headers.txt
