name: CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  worker-checks:
    name: Worker syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker deps
        run: cd worker && npm ci
      - name: Run Worker tests
        run: cd worker && npm test
      - name: Syntax check all Worker source files
        run: |
          cd worker
          for f in src/*.js; do
            cp "$f" "/tmp/$(basename "$f" .js).mjs"
            node --check "/tmp/$(basename "$f" .js).mjs" || exit 1
            echo "✅ $f"
          done

  theme-check:
    name: Shopify theme check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@4.4.0
      - name: Run theme check
        run: shopify theme check --path theme


  storefront-checks:
    name: Storefront syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Storefront deps
        run: cd storefront && npm ci
      - name: Run Storefront tests and syntax checks
        run: cd storefront && npm test && npm run syntax-check
      - name: Syntax check booking form JS
        run: |
          python3 -c "
import re
with open('storefront/public/booking.html') as f:
    content = f.read()
    scripts = re.findall(r'<script>(.*?)</script>', content, re.DOTALL)
    if scripts:
        with open('/tmp/booking-script.js', 'w') as out:
            out.write(scripts[0])
"
          node --check /tmp/booking-script.js || exit 1
          echo '✅ booking.html'
      - name: Syntax check dashboard JS
        run: |
          python3 -c "
import re
with open('storefront/public/dash.html') as f:
    content = f.read()
    scripts = re.findall(r'<script>(.*?)</script>', content, re.DOTALL)
    if scripts:
        with open('/tmp/dash-script.js', 'w') as out:
            out.write(scripts[0])
"
          node --check /tmp/dash-script.js || exit 1
          echo '✅ dash.html'
      - name: Syntax check other HTML pages
        run: |
          cd storefront/public
          for f in success.html track.html delivered.html; do
            python3 -c "
import re
with open('$f') as fh:
    c = fh.read()
    s = re.findall(r'<script>(.*?)</script>', c, re.DOTALL)
    if s:
        with open('/tmp/script.js', 'w') as out:
            out.write(s[0])
"
            node --check /tmp/script.js || exit 1
            echo "✅ $f"
          done

  version-check:
    name: Version metadata sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # current_version.sh + bump_version.sh need tag history
      - name: current_version.sh returns X.Y.Z
        run: |
          chmod +x scripts/*.sh
          v=$(./scripts/current_version.sh)
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::current_version.sh must return X.Y.Z, got '$v'"
            exit 1
          fi
          echo "current version = $v"
      - name: compute_build_number.sh runs
        run: |
          bn=$(./scripts/compute_build_number.sh)
          echo "BUILD_NUMBER=$bn"
          if ! [[ "$bn" =~ ^[0-9]+$ ]]; then
            echo "::error::build number is not an integer: $bn"
            exit 1
          fi
      - name: bump_version.sh --dry-run
        run: ./scripts/bump_version.sh --dry-run
