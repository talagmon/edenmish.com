name: Cybersecurity scan (Strix)

on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: Strix scan depth
        required: true
        default: quick
        type: choice
        options:
          - quick
          - standard

permissions:
  contents: read

concurrency:
  group: strix-staging
  cancel-in-progress: false

jobs:
  staging-security-scan:
    name: Scan source and isolated staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 90
    env:
      STRIX_LLM: ${{ vars.STRIX_LLM || 'openai/gpt-5.4' }}
      LLM_API_KEY: ${{ secrets.STRIX_LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate scan configuration
        run: |
          test -n "$LLM_API_KEY" || {
            echo "::error::Missing STRIX_LLM_API_KEY in the staging environment."
            exit 1
          }
          case "${{ inputs.scan_mode }}" in
            quick|standard) ;;
            *) echo "::error::Unsupported scan mode"; exit 1 ;;
          esac

      - name: Install pinned Strix release
        env:
          STRIX_VERSION: 1.3.1
          STRIX_SHA256: 4c4cc4e7cc8b050506b74433709b7a3d288261d967ea99df05bb4cf4a09ccd55
        run: |
          archive="/tmp/strix-${STRIX_VERSION}.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/usestrix/strix/releases/download/v${STRIX_VERSION}/strix-${STRIX_VERSION}-linux-x86_64.tar.gz" \
            --output "$archive"
          echo "${STRIX_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory /tmp
          sudo install -m 0755 "/tmp/strix-${STRIX_VERSION}-linux-x86_64" /usr/local/bin/strix
          strix --version

      - name: Run guarded staging assessment
        run: |
          strix --non-interactive \
            --target ./ \
            --target https://ops-staging.edenmish.com \
            --scan-mode "${{ inputs.scan_mode }}" \
            --instruction-file .github/strix-staging-rules.md

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-staging-${{ github.run_id }}
          path: strix_runs/
          if-no-files-found: warn
          retention-days: 14

