name: Production deploy

on:
  workflow_dispatch:
    inputs:
      deploy_worker:
        description: 'Deploy Cloudflare Worker'
        type: boolean
        required: true
        default: true
      deploy_theme:
        description: 'Push Shopify theme (unpublished)'
        type: boolean
        required: true
        default: true
      publish_theme:
        description: 'Also publish theme live (use with caution)'
        type: boolean
        required: true
        default: false
      confirm_migrations_ran:
        description: 'Type "I ran required migrations" to proceed'
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Production deployment
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify migration confirmation
        run: |
          if [ "${{ inputs.confirm_migrations_ran }}" != "I ran required migrations" ]; then
            echo "::error::Migration confirmation required. Type 'I ran required migrations' in the workflow input."
            echo ""
            echo "Required production migrations (run manually before deploying):"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/003_rate_limits.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/004_delivery_proofs.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/005_notifications.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/006_pod_signature.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/007_order_rating.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/008_coupons.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/009_invoice_tracking.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/010_order_service_schedule.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/011_cancellation_requests.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/014_driver_api_v1.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/015_driver_route_tasks.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/016_driver_route_integrity.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/017_driver_task_proofs.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/018_business_wallet.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/019_delivery_notification_outbox.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/021_business_entry_plans.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/022_business_plan_coupons.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/023_driver_login_invitations.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/024_phone_delivery_link_consent.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/025_delivery_failure_retained_package.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/026_redelivery_pending_address.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/027_retained_failure_notifications.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/028_redelivery_charges.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/029_wallet_reservation_ownership.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/030_whatsapp_template_delivery_audit.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/031_first_delivery_promotion.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/032_analytics_conversion_claims.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/033_business_batch_external_id.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/034_business_batch_mappings.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/037_driver_push_devices.sql"
            echo "  wrangler d1 execute edenmish --remote --file=./migrations/038_business_delivery_exceptions.sql"
            echo ""
            echo "See worker/MIGRATIONS.md for verification queries."
            exit 1
          fi
          echo "✅ Migration confirmation received."

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # bump_version.sh needs tag history

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Prepare version metadata
        id: ver
        run: |
          chmod +x scripts/*.sh
          v=$(./scripts/current_version.sh)
          bn=$(./scripts/compute_build_number.sh)
          sha=$(git rev-parse --short HEAD)
          echo "APP_VERSION=$v"  >> "$GITHUB_OUTPUT"
          echo "BUILD_NUMBER=$bn" >> "$GITHUB_OUTPUT"
          echo "GIT_SHA=$sha"     >> "$GITHUB_OUTPUT"
          echo "Version stamp: v$v #$bn ($sha)" >> "$GITHUB_STEP_SUMMARY"

      - name: Inject Worker version
        if: ${{ inputs.deploy_worker }}
        env:
          APP_VERSION: ${{ steps.ver.outputs.APP_VERSION }}
          BUILD_NUMBER: ${{ steps.ver.outputs.BUILD_NUMBER }}
          GIT_SHA: ${{ steps.ver.outputs.GIT_SHA }}
        run: ./scripts/inject-worker-version.sh

      - name: Inject theme version
        if: ${{ inputs.deploy_theme }}
        env:
          APP_VERSION: ${{ steps.ver.outputs.APP_VERSION }}
          BUILD_NUMBER: ${{ steps.ver.outputs.BUILD_NUMBER }}
          GIT_SHA: ${{ steps.ver.outputs.GIT_SHA }}
        run: ./scripts/inject-theme-version.sh

      - name: Deploy Cloudflare Worker
        if: ${{ inputs.deploy_worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd worker
          npm ci
          node scripts/validate-driver-schema.mjs --database edenmish --config wrangler.toml
          SECRET_LIST=$(npx wrangler secret list)
          if ! grep -q '"name": "DRIVER_ONE_TIME_CODE"' <<< "$SECRET_LIST"; then
            echo "::error::Production Worker secret DRIVER_ONE_TIME_CODE is missing. Configure it before enabling the driver API."
            exit 1
          fi
          if ! grep -q '"name": "GOOGLE_ROUTE_OPTIMIZATION_SERVICE_ACCOUNT_JSON"' <<< "$SECRET_LIST"; then
            echo "::error::Production Worker secret GOOGLE_ROUTE_OPTIMIZATION_SERVICE_ACCOUNT_JSON is missing."
            exit 1
          fi
          if ! grep -q '"name": "GOOGLE_PLACES_SERVER_KEY"' <<< "$SECRET_LIST"; then
            echo "::error::Production Worker secret GOOGLE_PLACES_SERVER_KEY is missing. Configure it before enabling business batch address validation."
            exit 1
          fi
          for secret_name in APNS_TEAM_ID APNS_KEY_ID APNS_PRIVATE_KEY_P8; do
            if ! grep -q "\"name\": \"$secret_name\"" <<< "$SECRET_LIST"; then
              echo "::error::Production Worker secret $secret_name is missing. Configure APNs before deploying driver push notifications."
              exit 1
            fi
          done
          npx wrangler deploy
          echo "✅ Worker deployed to find.edenmish.com + ops.edenmish.com"

      - name: Verify production Driver API boundary
        if: ${{ inputs.deploy_worker }}
        run: |
          set -euo pipefail
          RESPONSE_FILE="$RUNNER_TEMP/driver-api-smoke.json"
          for attempt in 1 2 3 4 5 6; do
            HTTP_STATUS="$(curl \
              --silent \
              --show-error \
              --max-time 20 \
              --output "$RESPONSE_FILE" \
              --write-out '%{http_code}' \
              --header 'X-Request-Id: 00000000-0000-4000-8000-000000000001' \
              --header 'X-Device-Installation-Id: 00000000-0000-4000-8000-000000000002' \
              --header 'X-Client-Version: 1.0.0+1 (abc1234)' \
              https://ops.edenmish.com/api/driver/v1/shifts/current)"
            if [[ "$HTTP_STATUS" == "401" ]] && grep -Fq '"code":"unauthorized"' "$RESPONSE_FILE"; then
              echo "✅ Production Driver API is live and enforcing bearer authentication"
              exit 0
            fi
            if [[ "$attempt" == "6" ]]; then
              echo "::error::Production Driver API smoke test expected 401 unauthorized but received HTTP $HTTP_STATUS."
              exit 1
            fi
            echo "Driver API is not ready yet; retrying in 10 seconds ($attempt/6)."
            sleep 10
          done

      - name: Install Shopify CLI
        if: ${{ inputs.deploy_theme }}
        run: npm install -g @shopify/cli@4.4.0

      - name: Push unpublished theme
        if: ${{ inputs.deploy_theme }}
        run: |
          # Name the preview theme so Shopify CLI never prompts in CI.
          shopify theme push --path theme --unpublished \
            --theme "Production preview" \
            --store "${{ secrets.SHOPIFY_STORE }}" \
            --password "${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}"
          echo "✅ Theme pushed as unpublished preview"

      - name: Publish theme live
        if: ${{ inputs.deploy_theme && inputs.publish_theme }}
        run: |
          echo "::warning::Publishing theme LIVE. This cannot be undone from this workflow."
          # Merchant settings in the live theme editor are production data. Keep
          # preview pushes complete, but never overwrite those files on a live push.
          shopify theme push --path theme --live --allow-live \
            --ignore "config/settings_data.json" \
            --ignore "templates/*.json" \
            --store "${{ secrets.SHOPIFY_STORE }}" \
            --password "${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}"
          echo "✅ Theme published LIVE on edenmish.com"

      - name: Post-deploy summary
        run: |
          echo "## Production deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: ${{ inputs.deploy_worker && '✅ deployed' || '⏭️ skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Theme push: ${{ inputs.deploy_theme && '✅ pushed' || '⏭️ skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Theme live: ${{ inputs.publish_theme && '✅ published' || '⏭️ not published (manual)' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: v${{ steps.ver.outputs.APP_VERSION }} #${{ steps.ver.outputs.BUILD_NUMBER }} (${{ steps.ver.outputs.GIT_SHA }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Next: smoke test" >> "$GITHUB_STEP_SUMMARY"
          echo "- Submit order → Draft Order → pay → webhook → tracking → ops → delivery proof → notifications" >> "$GITHUB_STEP_SUMMARY"
