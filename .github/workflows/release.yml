name: Release (version bump)

# Auto-bumps the repo-root VERSION file from Conventional Commits since the
# last v* tag, then commits VERSION back and pushes a vX.Y.Z tag.
#
# Trigger: any push to main that lands a merge commit (i.e. a PR merged).
# Direct pushes that are version-irrelevant (chore:/test:/docs:) are a no-op
# because scripts/bump_version.sh exits 0 without writing.
#
# This workflow does NOT deploy. Production deploy stays manual
# (production-deploy.yml, workflow_dispatch + production environment approval)
# per AGENTS.md §8.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'VERSION'
      - 'CHANGELOG.md'
# When the bot commits the VERSION bump, that push would re-trigger this
# workflow. paths-ignore on VERSION breaks the loop. (The next merged PR
# with feat/fix commits will pick up where the last tag left off.)

permissions:
  contents: write   # needed to push the VERSION commit + tag back to main

concurrency:
  group: release-bump
  cancel-in-progress: false   # never cancel — a skipped bump would drift VERSION

jobs:
  bump:
    name: Bump VERSION from conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history + tags for bump_version.sh
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run bump_version.sh
        id: bump
        run: |
          chmod +x scripts/*.sh
          before=$(tr -d '[:space:]' < VERSION)
          ./scripts/bump_version.sh --tag
          after=$(tr -d '[:space:]' < VERSION)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after"   >> "$GITHUB_OUTPUT"
          if [[ "$before" == "$after" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No version bump (no feat/fix/breaking commits since last tag)."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Bump: $before → $after"
          fi

      - name: Commit VERSION + push tag
        if: steps.bump.outputs.changed == 'true'
        run: |
          git add VERSION
          git commit -m "chore(release): bump VERSION ${{ steps.bump.outputs.before }} → ${{ steps.bump.outputs.after }}

          Auto-generated by release.yml from conventional commits.
          See scripts/bump_version.sh."
          git push
          git push origin "v${{ steps.bump.outputs.after }}"

      - name: Summary
        if: always()
        run: |
          echo "## Release bump" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.bump.outputs.changed }}" == "true" ]]; then
            echo "- ${{ steps.bump.outputs.before }} → **${{ steps.bump.outputs.after }}**" >> "$GITHUB_STEP_SUMMARY"
            echo "- tag \`v${{ steps.bump.outputs.after }}\` pushed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Production deploy is **still manual** — go to Actions → Production deploy." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No bump (no feat/fix/breaking commits since last tag)" >> "$GITHUB_STEP_SUMMARY"
          fi
