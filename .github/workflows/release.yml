name: Release (version tag)

# Auto-creates a vX.Y.Z tag from Conventional Commits since the last v* tag.
#
# Source of truth for the version name is git tags themselves
# (scripts/current_version.sh reads the latest v* tag). The bot only
# pushes tags — never commits to main. This means:
#   - main's history stays 100% human-authored (no chore(release) commits).
#   - The workflow works regardless of main's branch-protection rules
#     (tags are not subject to branch protection).
#   - No self-trigger loop — tag pushes don't re-trigger this workflow.
#
# This workflow does NOT deploy. Production deploy stays manual
# (production-deploy.yml, workflow_dispatch + production environment approval)
# per AGENTS.md §8.

on:
  push:
    branches: [main]

permissions:
  contents: write   # needed to push the vX.Y.Z tag

concurrency:
  group: release-tag
  cancel-in-progress: false   # never cancel — a skipped tag would drift the version

jobs:
  tag:
    name: Create vX.Y.Z tag from conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history + tags for bump_version.sh
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run bump_version.sh --tag
        id: bump
        run: |
          chmod +x scripts/*.sh
          output=$(./scripts/bump_version.sh --tag)
          echo "$output"
          new_tag=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          if [[ -n "$new_tag" && "$output" == bump* ]]; then
            echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"
            echo "changed=true"   >> "$GITHUB_OUTPUT"
          else
            echo "changed=false"  >> "$GITHUB_OUTPUT"
          fi

      - name: Push tag
        if: steps.bump.outputs.changed == 'true'
        run: git push origin "${{ steps.bump.outputs.new_tag }}"

      - name: Summary
        if: always()
        run: |
          echo "## Release tag" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.bump.outputs.changed }}" == "true" ]]; then
            echo "- new tag: **${{ steps.bump.outputs.new_tag }}** pushed" >> "$GITHUB_STEP_SUMMARY"
            echo "- main history unchanged (no chore(release) commit)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Production deploy is **still manual** — Actions → Production deploy." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- no new tag (no feat/fix/breaking commits since last tag)" >> "$GITHUB_STEP_SUMMARY"
          fi
