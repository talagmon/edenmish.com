# EdenMish v2 — Cloudflare Pages (static frontend)
# Served at v2.edenmish.com (custom domain configured in the Cloudflare dashboard).
# This project has NO backend. Order creation is proxied to the existing Worker API:
#   POST https://find.edenmish.com/api/orders
# (requires v2.edenmish.com added to that worker's ALLOWED_ORIGINS — see README).

name = "edenmish-v2"
pages_build_output_dir = "public"
compatibility_date = "2024-11-01"

# Cloudflare Pages build settings (set in the dashboard):
#   Build command:          npm run build
#   Build output directory: public
# `npm run build` compiles Tailwind (src/styles.css -> public/assets/styles.css).

# Do NOT add production custom_domain/routes here without explicit approval.
# Local preview:  npm run build && npm run serve
