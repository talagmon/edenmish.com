<script>
var API = window.EDEN_API.ops;
var HE = {received:"נתקבלה",priced:"מחושב",review:"בדיקה",payment_sent:"תשלום נשלח",paid:"שולם",to_pickup:"בדרך לאיסוף",picked_up:"נאסף",to_dropoff:"בדרך למסירה",delivered:"נמסר",failed:"נכשל",cancelled:"בוטל"};
var LIVE = ["to_pickup","to_dropoff"];
var ACTIVE = ["to_pickup","picked_up","to_dropoff"];
var NEXT = {paid:"to_pickup",to_pickup:"picked_up",picked_up:"to_dropoff"};
var NEXTLBL = {paid:"אשר יציאה לאיסוף",to_pickup:"אשר איסוף ✓",picked_up:"אשר יציאה למסירה"};
var orders = [], coupons = [], driverInvitations = [], driverInviteLatest = null, webhookHealth = null, driverDispatch = null, activeOrder = null, podOrderId = null, sigCtx = null, sigDrawing = false, sigHas = false, watchId = null, gpsOrderId = null, gpsState = "idle", activeFilter = "active", currentView = "queue";

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function fmt(t){return t?new Date(t).toLocaleString("he-IL",{timeZone:"Asia/Jerusalem",hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit"}):"—";}
function $(id){return document.getElementById(id);}
function showTransientError(message){
  var el=$("ops-network-error");
  if(!el){el=document.createElement("div");el.id="ops-network-error";el.setAttribute("role","alert");el.className="fixed top-4 left-1/2 -translate-x-1/2 z-[100] bg-error text-white px-4 py-3 rounded-xl shadow-xl max-w-[90vw]";document.body.appendChild(el);}
  el.textContent=message;el.hidden=false;clearTimeout(el._timer);el._timer=setTimeout(function(){el.hidden=true;},5000);
}
function connectionErrorView(){
  $("app").innerHTML = '<div class="dashboard-auth-shell min-h-screen flex items-center justify-center p-gutter-mobile">'+
    '<div class="dashboard-auth-card glass-card rounded-3xl p-stack-lg max-w-sm w-full text-center" role="alert">'+
    '<span class="material-symbols-outlined text-error text-5xl mb-stack-sm">cloud_off</span>'+
    '<h1 class="font-headline-md text-headline-md text-primary mb-stack-sm">לא ניתן להתחבר למרכז הבקרה</h1>'+
    '<p class="text-body-md text-on-surface-variant mb-stack-lg">סביבת השרת אינה זמינה כרגע. לא בוצע שום שינוי בהזמנות.</p>'+
    '<button class="dashboard-auth-button w-full text-on-primary font-headline-md py-3" onclick="refresh()">נסו שוב</button>'+
    '</div></div>';
}
async function api(path,opts){
  opts=opts||{};opts.headers=opts.headers||{};
  opts.headers["Content-Type"]="application/json";
  opts.credentials="include";
  return fetch(API+path,opts);
}

// The session is held only in an HttpOnly cookie. JavaScript never receives or
// persists the bearer credential; the initial refresh at the end probes it.

function loginView(){
  $("app").innerHTML = '<div class="dashboard-auth-shell min-h-screen flex items-center justify-center p-gutter-mobile">'+
    '<div class="dashboard-auth-card glass-card rounded-3xl p-stack-lg max-w-sm w-full text-center">'+
    '<div class="dashboard-auth-icon flex items-center justify-center mx-auto mb-stack-md">'+
    '<span class="material-symbols-outlined text-4xl">two_wheeler</span></div>'+
    '<h1 class="dashboard-auth-title font-label-bold text-label-bold mb-1">מעקב הזמנות | עדן מיש</h1>'+
    '<p class="text-body-md text-on-surface-variant mb-stack-lg">מרכז הבקרה</p>'+
    '<input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="הזן PIN" class="dashboard-auth-input w-full text-on-surface p-3 text-center text-xl mb-stack-md" style="letter-spacing:6px" onkeydown="if(event.key===\'Enter\')doLogin()"/>'+
    '<button class="dashboard-auth-button w-full text-on-primary font-headline-md py-4" onclick="doLogin()">התחבר</button>'+
    '</div></div>';
}

async function doLogin(){
  var pin = $("pin").value;
  try{
    var r = await fetch(API+"/api/ops/login",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({pin:pin})});
    if(r.ok){await refresh();}
    else{alert(r.status===429?"יותר מדי ניסיונות":"PIN שגוי");}
  }catch(e){connectionErrorView();}
}
async function logout(){try{await api("/api/ops/logout",{method:"POST"});}finally{stopWatch();loginView();}}

// ---- Ops queue helpers ----
var STALE_PAYMENT_MS = 60*60*1000;
var ISRAEL_DAY_FORMAT = new Intl.DateTimeFormat("en-US", {timeZone:"Asia/Jerusalem",year:"numeric",month:"2-digit",day:"2-digit"});
function israelDateKey(timestamp){
  var parts=ISRAEL_DAY_FORMAT.formatToParts(new Date(Number(timestamp)));
  var values={};parts.forEach(function(part){if(part.type!=="literal")values[part.type]=part.value;});
  return values.year+"-"+values.month+"-"+values.day;
}
function isActiveOrder(o){return ACTIVE.includes(o.status);}
function dailyOpsSummary(items,now){
  var today=israelDateKey(now);
  var deliveredToday=items.filter(function(o){return o.status==="delivered"&&o.delivered_at&&israelDateKey(o.delivered_at)===today;});
  var stalePayment=items.filter(function(o){
    return ["priced","payment_sent"].includes(o.status)&&o.payment_status!=="paid"&&Number(o.created_at)>0&&Number(o.created_at)<=now-STALE_PAYMENT_MS;
  });
  return {
    delivered:deliveredToday.length,
    revenue:deliveredToday.reduce(function(sum,o){return sum+(Number(o.price)||0);},0),
    stalePayment:stalePayment.length
  };
}
function scheduleSortKey(o){
  var match=String(o.when_date||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!match)return Infinity;
  var rawHour=o.when_hour;
  var hour=rawHour!==null&&rawHour!==undefined&&String(rawHour).trim()!==""?Number(rawHour):23;
  if(!Number.isFinite(hour))hour=23;
  return Date.UTC(Number(match[1]),Number(match[2])-1,Number(match[3]),Math.max(0,Math.min(23,hour)));
}
function compareQueueOrders(a,b,scheduleFirst){
  var pa=(a.urgent||a.review_flag)?0:1,pb=(b.urgent||b.review_flag)?0:1;
  if(pa!==pb)return pa-pb;
  if(scheduleFirst){var sa=scheduleSortKey(a),sb=scheduleSortKey(b);if(sa!==sb)return sa-sb;}
  var da=deliveryDeadline(a)||Infinity,db=deliveryDeadline(b)||Infinity;
  if(da!==db)return da-db;
  return Number(b.id||0)-Number(a.id||0);
}

async function refresh(){
  var r;
  try{r = await api("/api/ops/orders");}catch(e){return connectionErrorView();}
  if(r.status===401) return loginView();
  if(!r.ok) return showTransientError("לא ניתן לרענן כרגע. בדקו את החיבור ונסו שוב.");
  var payload = await r.json();
  orders = payload.orders || [];
  webhookHealth = payload.integrations && payload.integrations.shopify_webhooks || null;
  try{
    var dr = await api("/api/ops/driver");
    if(dr.ok) driverDispatch = await dr.json();
  }catch(e){}
  if(activeOrder){
    var u = orders.find(function(o){return o.id===activeOrder.id;});
    if(u){activeOrder=u;return renderDetail(u);}
  }
  if(currentView==="stats") renderStats(); else if(currentView==="coupons") renderCoupons(); else renderQueue();
}

function renderQueue(){
  var counts = {
    all: orders.length,
    inbox: orders.filter(function(o){return ["received","priced","review","payment_sent","paid"].includes(o.status);}).length,
    active: orders.filter(isActiveOrder).length,
    done: orders.filter(function(o){return o.status==="delivered";}).length,
    cancelled: orders.filter(function(o){return o.status==="cancelled";}).length,
    problems: orders.filter(function(o){return ["failed","refund_pending"].includes(o.status);}).length
  };
  var revenue = orders.filter(function(o){return o.payment_status==='paid';}).reduce(function(s,o){return s+(o.price||0);},0);
  var daily = dailyOpsSummary(orders,Date.now());
  var urgentCount = orders.filter(function(o){return (o.urgent||o.review_flag) && !["delivered","cancelled","failed"].includes(o.status);}).length;

  var filtered = orders;
  if(activeFilter==="inbox") filtered = orders.filter(function(o){return ["received","priced","review","payment_sent","paid"].includes(o.status);});
  else if(activeFilter==="active") filtered = orders.filter(isActiveOrder);
  else if(activeFilter==="done") filtered = orders.filter(function(o){return o.status==="delivered";});
  else if(activeFilter==="cancelled") filtered = orders.filter(function(o){return o.status==="cancelled";});
  else if(activeFilter==="problems") filtered = orders.filter(function(o){return ["failed","refund_pending"].includes(o.status);});

  var sorted = filtered.slice().sort(function(a,b){return compareQueueOrders(a,b,activeFilter==="active");});
  if(activeFilter==="all") sorted = sorted.slice(0,200);
  if(activeFilter==="done") sorted = sorted.slice(0,100);
  var cards = sorted.map(queueCard).join("");

  function kpiCard(label,val,color){
    return '<div class="glass-card flex-1 rounded-xl p-2 text-center min-w-0"><div class="text-label-sm text-on-surface-variant truncate">'+label+'</div><div class="font-headline-md text-headline-md-mobile mt-0.5 text-'+color+' truncate">'+val+'</div></div>';
  }
  function dailyCard(label,val,icon,tone){
    return '<div class="glass-card rounded-xl p-2 min-w-0 flex items-center gap-2"><span class="material-symbols-outlined text-'+tone+' text-xl">'+icon+'</span><div class="min-w-0"><div class="font-label-bold text-'+tone+' truncate">'+val+'</div><div class="text-label-sm text-on-surface-variant truncate">'+label+'</div></div></div>';
  }
  function tabBtn(key,label,count){
    var isActive = activeFilter===key;
    var bg = isActive ? (key==="problems"?"bg-error/20 text-error":key==="done"?"bg-success-mint/20 text-success-mint":key==="active"?"bg-secondary-container text-on-secondary":"bg-primary-container text-on-primary-container") : "glass-card text-on-surface-variant";
    var dot = (key==="problems"&&count>0) ? '<span class="w-1.5 h-1.5 bg-error rounded-full animate-pulse mr-1"></span>' : '';
    return '<button onclick="setFilter(\''+key+'\')" class="px-3 py-2 rounded-xl font-label-bold text-label-sm whitespace-nowrap transition-all '+bg+' flex items-center gap-1">'+dot+label+' <span class="opacity-60">('+count+')</span></button>';
  }
  function webhookWarning(){
    if(!webhookHealth || webhookHealth.ready || ["idle","checking"].includes(webhookHealth.status)) return "";
    var text = webhookHealth.status==="unconfigured"
      ? "חיבור Shopify אינו מוגדר במלואו. תשלומים וזיכויים עלולים שלא להסתנכרן."
      : "לא ניתן לאמת אוטומטית את חיבורי Shopify. בדקו את הגדרות ה‑Webhooks.";
    return '<div class="glass-card border border-alert-amber/40 bg-alert-amber/10 rounded-xl p-3 flex items-start gap-2 text-alert-amber" role="alert">'+
      '<span class="material-symbols-outlined shrink-0">warning</span><span class="text-label-sm">'+text+'</span></div>';
  }
  function driverPanel(){
    var d=driverDispatch;
    if(!d)return '<div class="glass-card rounded-xl p-3 text-on-surface-variant">סטטוס השליח נטען…</div>';

function attachSwipeHandlers(){
  document.querySelectorAll("div[data-oid]").forEach(function(el){
    var oid = el.dataset.oid;
    var sx = 0, dx = 0, moved = false;
    el.addEventListener("touchstart", function(e){
      sx = e.touches[0].clientX; el.style.transition="none"; moved=false;
    }, {passive:true});
    el.addEventListener("touchmove", function(e){
      dx = e.touches[0].clientX - sx;
      if(dx>0) dx*=0.2;
      if(Math.abs(dx)>10) moved=true;
      el.style.transform="translateX("+dx+"px)";
      el.style.opacity=Math.max(0.4,1-Math.abs(dx)/300);
    }, {passive:true});
    el.addEventListener("touchend", function(){
      el.style.transition="transform 0.3s ease, opacity 0.3s ease";
      if(moved && dx<-140){
        el.style.transform="translateX(-120%)"; el.style.opacity="0";
        var id = oid;
        setTimeout(function(){
          if(confirm("לבטל את ההזמנה #"+id+"?")){ cancelOrder(id); }
          else { var c=document.getElementById("card-"+id); if(c){c.style.transform="translateX(0)";c.style.opacity="1";} }
        },250);
      } else {
        el.style.transform="translateX(0)"; el.style.opacity="1";
      }
    }, {passive:true});
  });
}

// Delivery deadline (SLA): Flash 90min, Standard 4h, Eco end-of-day from created_at
function deliveryDeadline(o){
  if(!o.created_at) return null;
  var c=Number(o.created_at);
  if(o.service==='flash') return c+90*60*1000;
  if(o.service==='standard') return c+4*60*60*1000;
  var d=new Date(c); var eod=new Date(d.getFullYear(),d.getMonth(),d.getDate(),20,0,0);
  if(eod.getTime()<c) eod.setDate(eod.getDate()+1);
  return eod.getTime();
}
function timeLeftBadge(o){
  var onlyActive = ["paid","to_pickup","picked_up","to_dropoff"].includes(o.status);
  var onlyDelivered = o.status==="delivered";
  if(!onlyActive && !onlyDelivered) return "";
  var dl=deliveryDeadline(o); if(!dl) return "";
  var ref = onlyDelivered && o.delivered_at ? Number(o.delivered_at) : Date.now();
  var diff=dl-ref; var ad=Math.abs(diff); var mins=Math.floor(ad/60000);
  var hrs=Math.floor(mins/60); var m=mins%60;
  var label=hrs>0?hrs+'ש'+m+'ד\'':mins+'ד\'';
  if(onlyDelivered){
    if(ref<=dl) return '<span class="text-label-sm text-success-mint flex items-center gap-0.5"><span class="material-symbols-outlined text-[14px]">check_circle</span>בזמן</span>';
    return '<span class="text-label-sm text-error flex items-center gap-0.5"><span class="material-symbols-outlined text-[14px]">warning</span>איחור '+label+'</span>';
  }
  if(diff<0) return '<span class="text-label-sm text-error font-bold flex items-center gap-0.5"><span class="material-symbols-outlined text-[14px]">warning</span>איחור '+label+'</span>';
  if(mins<15) return '<span class="text-label-sm text-error animate-pulse flex items-center gap-0.5"><span class="material-symbols-outlined text-[14px]">timer</span>'+label+'</span>';
  if(mins<30) return '<span class="text-label-sm text-alert-amber flex items-center gap-0.5"><span class="material-symbols-outlined text-[14px]">timer</span>'+label+'</span>';
  return '<span class="text-label-sm text-success-mint flex items-center gap-0.5"><span class="material-symbols-outlined text-[14px]">timer</span>'+label+'</span>';
}
function compactDuration(ms){
  var mins=Math.max(0,Math.floor(Math.abs(ms)/60000)),hrs=Math.floor(mins/60),rest=mins%60;
  return hrs>0?hrs+'ש׳ '+rest+'ד׳':mins+' דק׳';
}
function queueTimingInfo(o){
  var dl=deliveryDeadline(o),terminal=o.status==="delivered",active=["paid","to_pickup","picked_up","to_dropoff"].includes(o.status);
  if(dl&&(active||terminal)){
    var ref=terminal&&o.delivered_at?Number(o.delivered_at):Date.now(),diff=dl-ref;
    if(terminal)return {label:"עמידה ביעד",value:diff>=0?"הושלם בזמן":"איחור "+compactDuration(diff),tone:diff>=0?"":" is-late"};
    return {label:diff>=0?"זמן שנותר":"איחור",value:compactDuration(diff),tone:diff<0?" is-late":diff<30*60*1000?" is-soon":""};
  }
  return {label:"חלון שירות",value:o.when_text||[o.when_date,o.when_hour].filter(Boolean).join(" · ")||"בתיאום",tone:""};
}

function renderStats(){
  var delivered=orders.filter(function(o){return o.status==='delivered';});
  var failed=orders.filter(function(o){return ['failed','cancelled'].includes(o.status);});
  var onTime=0,lateDel=0;
  delivered.forEach(function(o){var dl=deliveryDeadline(o);if(!dl||!o.delivered_at)return;if(Number(o.delivered_at)<=dl)onTime++;else lateDel++;});

var _swipe = {id:null,x:0,startX:0,el:null,moved:false,suppressClick:false};
function cardClick(id){
  if(_swipe.suppressClick){ _swipe.suppressClick=false; return; }
  openOrder(id);
}
function swipeStart(e){
  _swipe.startX = e.touches[0].clientX;
  _swipe.el = e.currentTarget;
  _swipe.id = _swipe.el.dataset.oid;
  _swipe.moved = false;
  _swipe.el.style.transition = "none";
}
function swipeMove(e){
  if(!_swipe.el) return;
  var dx = e.touches[0].clientX - _swipe.startX;
  if(dx > 0) dx = dx * 0.2;
  if(Math.abs(dx) > 10) _swipe.moved = true;
  _swipe.x = dx;
  _swipe.el.style.transform = "translateX("+dx+"px)";
  var abs = Math.abs(dx);
  _swipe.el.style.opacity = Math.max(0.4, 1 - abs/300);
}
function swipeEnd(e){
  if(!_swipe.el) return;
  _swipe.el.style.transition = "transform 0.3s ease, opacity 0.3s ease";
  if(_swipe.moved) _swipe.suppressClick = true;
  if(_swipe.x < -140){
    _swipe.el.style.transform = "translateX(-120%)";
    _swipe.el.style.opacity = "0";
    var oid = _swipe.id;
    setTimeout(function(){
      if(confirm("לבטל את ההזמנה #"+oid+"?")){
        cancelOrder(oid);
      } else {
        var el = document.getElementById("card-"+oid);
        if(el){el.style.transform="translateX(0)";el.style.opacity="1";}
      }
    }, 250);
  } else {
    _swipe.el.style.transform = "translateX(0)";
    _swipe.el.style.opacity = "1";
  }
  _swipe.el = null;
}
function swipeTransitionEnd(e){
  if(e.propertyName === "transform" && e.target.style.transform === "translateX(0)"){
    e.target.style.transition = "";
  }
}

function initSig(){
  var c=$("pod-sig");if(!c||c.dataset.ready)return;
  var dpr=devicePixelRatio||1;
  c.width=c.clientWidth*dpr;c.height=c.clientHeight*dpr;
  sigCtx=c.getContext("2d");sigCtx.scale(dpr,dpr);
  sigCtx.lineWidth=2.5;sigCtx.lineCap="round";sigCtx.strokeStyle="#8B5CF6";
  function pt(e){var r=c.getBoundingClientRect();return{x:(e.clientX||(e.touches&&e.touches[0]?e.touches[0].clientX:0))-r.left,y:(e.clientY||(e.touches&&e.touches[0]?e.touches[0].clientY:0))-r.top};}
  function dn(e){sigDrawing=true;var p=pt(e);sigCtx.beginPath();sigCtx.moveTo(p.x,p.y);}
  function mv(e){if(!sigDrawing)return;var p=pt(e);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();sigCtx.beginPath();sigCtx.moveTo(p.x,p.y);sigHas=true;}
  function up(){sigDrawing=false;sigCtx.beginPath();}
  c.addEventListener("mousedown",dn);
  c.addEventListener("mousemove",mv);
  window.addEventListener("mouseup",up);
  c.addEventListener("touchstart",function(e){e.preventDefault();dn(e);},{passive:false});
  c.addEventListener("touchmove",function(e){e.preventDefault();mv(e);},{passive:false});
  c.addEventListener("touchend",up);
  c.dataset.ready="1";
}
function clearSig(){var c=$("pod-sig");if(sigCtx&&c)sigCtx.clearRect(0,0,c.width,c.height);sigHas=false;}

async function submitPod(id){
  var btn=$("pod-submit");btn.disabled=true;btn.textContent="שולח…";
  var photo=null;
  var f=$("pod-photo").files[0];
  if(f){
    photo=await new Promise(function(resolve){
      var fr=new FileReader();
      fr.onload=function(){var img=new Image();img.onload=function(){var s=Math.min(1,1024/Math.max(img.width,img.height));var c=document.createElement("canvas");c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",0.7));};img.src=fr.result;};
      fr.readAsDataURL(f);
    });
  }
  var sig=sigHas?$("pod-sig").toDataURL("image/png"):null;
  try{
    var r=await api("/api/ops/orders/"+id+"/deliver",{method:"POST",body:JSON.stringify({receiver_name:$("pod-recv").value,delivery_note:$("pod-note").value,photo_url:photo,signature:sig})});
    var d=await r.json();
    if(d.ok){podOrderId=null;stopWatch();await refresh();}
    else{throw 0;}
  }catch(e){
    btn.disabled=false;btn.textContent="אשר מסירה וסגור משימה";
    alert("שגיאה בשמירת הוכחת המסירה");
  }
}

function gpsControlHtml(id){
  var state=gpsOrderId===id?gpsState:"idle";
  var sharing=watchId!==null&&state==="active";
  var requesting=state==="requesting";
  var status=sharing?"שיתוף המיקום פעיל":requesting?"ממתין לאישור מיקום":state==="denied"?"הרשאת המיקום נדחתה":state==="error"?"המיקום אינו זמין כרגע":"שיתוף המיקום כבוי";
  var icon=sharing?"location_on":requesting?"progress_activity":"location_off";
  var label=sharing||requesting?"הפסקת שיתוף מיקום":"התחלת שיתוף מיקום";
  var tone=sharing?"text-success-mint":state==="denied"||state==="error"?"text-error":"text-on-surface-variant";
  return '<div id="gps-control-'+id+'" class="glass-card rounded-xl p-3 border border-outline-variant/30">'+
    '<div class="flex items-center justify-between gap-3 mb-2"><div class="flex items-center gap-2 '+tone+'"><span class="material-symbols-outlined">'+icon+'</span><span id="gps-status-'+id+'" aria-live="polite" class="font-label-bold text-label-sm">'+status+'</span></div></div>'+
    '<button type="button" onclick="toggleGps('+id+')" class="w-full '+(sharing||requesting?'bg-error/15 text-error':'bg-secondary/15 text-secondary')+' font-label-bold py-3 rounded-xl">'+label+'</button></div>';
}
function updateGpsControl(id){
  var el=$("gps-control-"+id);if(el)el.outerHTML=gpsControlHtml(id);
}
function toggleGps(id){
  if((watchId!==null||gpsState==="requesting")&&gpsOrderId===id)stopWatch();else startWatch(id);
}
function startWatch(id){
  if(!navigator.geolocation){gpsState="error";gpsOrderId=id;updateGpsControl(id);showTransientError("שירותי מיקום אינם זמינים במכשיר הזה.");return;}
  if(watchId!==null)stopWatch();
  gpsOrderId=id;gpsState="requesting";updateGpsControl(id);
  try{
    watchId=navigator.geolocation.watchPosition(function(p){
      gpsState="active";updateGpsControl(id);
      var c=p.coords;
      api("/api/ops/orders/"+id+"/gps",{method:"POST",body:JSON.stringify({lat:c.latitude,lng:c.longitude})}).catch(function(){});
    },function(err){
      if(watchId!==null)navigator.geolocation.clearWatch(watchId);
      watchId=null;gpsState=err&&err.code===1?"denied":"error";updateGpsControl(id);
      showTransientError(gpsState==="denied"?"הרשאת המיקום נדחתה. ניתן לנסות שוב מהכפתור.":"לא הצלחנו לקבל מיקום. בדקו את שירותי המיקום ונסו שוב.");
    },{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
  }catch(e){watchId=null;gpsState="error";updateGpsControl(id);showTransientError("לא הצלחנו להפעיל שיתוף מיקום.");}
}
function stopWatch(){
  var id=gpsOrderId;
  if(watchId!==null)navigator.geolocation.clearWatch(watchId);
  watchId=null;gpsOrderId=null;gpsState="idle";
  if(id!=null)updateGpsControl(id);
}

      '<option value="business_plan" '+(couponScope==='business_plan'?'selected':'')+'>רכישת מסלול עסקי</option>'+
    '</select></div>'+
    '<div id="c-business-plans" class="glass-card rounded-xl p-3 '+(couponScope==='business_plan'?'':'hidden')+'"><div class="text-label-sm text-on-surface-variant mb-2">מסלולים תקפים · ללא בחירה = כל המסלולים</div><div class="grid grid-cols-2 gap-2">'+
      [['trial','ניסיון'],['wallet','ארנק'],['silver','כסף'],['gold','זהב'],['platinum','פלטינום']].map(function(p){return '<label class="flex items-center gap-2"><input type="checkbox" name="c-plan" value="'+p[0]+'" '+(planIds.includes(p[0])?'checked':'')+' class="accent-secondary"/><span class="text-label-sm">'+p[1]+'</span></label>';}).join('')+
    '</div></div>'+
    '<div class="grid grid-cols-1 gap-2">'+
      '<label class="flex items-start gap-2 glass-card rounded-xl p-3 cursor-pointer"><input id="c-auto" type="checkbox" '+(c&&c.auto_apply?'checked':'')+' onchange="syncPromotionCouponFields()" class="accent-secondary mt-1"/><span><b class="text-label-sm text-on-surface">החלה אוטומטית</b><small class="block text-on-surface-variant">השרת בודק זכאות ומחיל את ההטבה ללא צורך בהקלדת הקוד.</small></span></label>'+
      '<label class="flex items-start gap-2 glass-card rounded-xl p-3 cursor-pointer"><input id="c-first-delivery" type="checkbox" '+(c&&c.eligibility_rule==='first_delivery'?'checked':'')+' onchange="syncPromotionCouponFields()" class="accent-secondary mt-1"/><span><b class="text-label-sm text-on-surface">ללקוחות ללא משלוח קודם</b><small class="block text-on-surface-variant">חל על משלוח בודד ללקוח פרטי או לחשבון עסקי מאומת, פעם אחת, לאחר בדיקת היסטוריית תשלום.</small></span></label>'+
    '</div>'+
    '<div class="flex gap-3">'+
      '<label class="flex-1 flex items-center gap-2 glass-card rounded-xl p-3 cursor-pointer '+(c&&c.value_type==='percentage'?'ring-1 ring-secondary':'')+'"><input type="radio" name="c-type" value="percentage" '+(c&&c.value_type==='percentage'?'checked':'')+' class="accent-secondary"/><span class="text-label-sm text-on-surface">אחוז %</span></label>'+
      '<label class="flex-1 flex items-center gap-2 glass-card rounded-xl p-3 cursor-pointer '+(c&&c.value_type==='fixed_amount'?'ring-1 ring-secondary':'')+'"><input type="radio" name="c-type" value="fixed_amount" '+(c&&c.value_type==='fixed_amount'?'checked':'')+' class="accent-secondary"/><span class="text-label-sm text-on-surface">סכום קבוע ₪</span></label>'+
    '</div>'+
    '<div><label class="text-label-sm text-on-surface-variant block mb-1">ערך</label><input id="c-value" type="number" min="0" placeholder="10" class="w-full bg-surface-container-low border-b-2 border-outline-variant text-on-surface rounded-t-lg p-3 text-right" value="'+(c?esc((c.value||0).toString()):'')+'"/></div>'+
    '<div class="grid grid-cols-2 gap-3">'+
      '<div><label class="text-label-sm text-on-surface-variant block mb-1">התחלה (אופציונלי)</label><input id="c-starts" type="datetime-local" step="0.001" class="w-full bg-surface-container-low border-b-2 border-outline-variant text-on-surface rounded-t-lg p-3 text-right" dir="ltr" value="'+(c&&c.starts_at?toDatetimeLocal(c.starts_at):'')+'"/></div>'+
      '<div><label class="text-label-sm text-on-surface-variant block mb-1">סיום (אופציונלי)</label><input id="c-ends" type="datetime-local" step="0.001" class="w-full bg-surface-container-low border-b-2 border-outline-variant text-on-surface rounded-t-lg p-3 text-right" dir="ltr" value="'+(c&&c.ends_at?toDatetimeLocal(c.ends_at):'')+'"/></div>'+
    '</div>'+
    '<div class="grid grid-cols-2 gap-3">'+
      '<div><label class="text-label-sm text-on-surface-variant block mb-1">מגבלת שימוש (אופציונלי)</label><input id="c-limit" type="number" min="1" placeholder="ללא הגבלה" class="w-full bg-surface-container-low border-b-2 border-outline-variant text-on-surface rounded-t-lg p-3 text-right" value="'+(c&&c.usage_limit!=null?esc(c.usage_limit.toString()):'')+'"/></div>'+
      '<div class="flex items-center gap-2 glass-card rounded-xl p-3 mt-5"><input id="c-once" type="checkbox" '+(c&&c.applies_once_per_customer?'checked':'')+' class="accent-secondary"/><label for="c-once" class="text-label-sm text-on-surface">הזן קוד פר לקוח</label></div>'+
    '</div>'+
    '<div><label class="text-label-sm text-on-surface-variant block mb-1">סטטוס</label><select id="c-status" class="w-full bg-surface-container-low border-b-2 border-outline-variant text-on-surface rounded-t-lg p-3">'+
      '<option value="active" '+(c&&c.status==='active'?'selected':'')+'>פעיל</option>'+
      '<option value="inactive" '+(c&&c.status==='inactive'?'selected':'')+'>מושבת</option>'+
      '<option value="scheduled" '+(c&&c.status==='scheduled'?'selected':'')+'>מתוזמן</option>'+
    '</select></div>'+
    '</div>'+
    '<button id="c-submit" onclick="submitCoupon('+(c?"'"+esc(c.code)+"'":'null')+')" class="w-full bg-tertiary text-on-tertiary font-headline-md py-4 rounded-xl shadow-xl shadow-tertiary/10 active:scale-95">'+(c?'שמור שינויים':'צור קופון')+'</button>'+
    '</div></div>';
  var tmp = document.createElement("div"); tmp.innerHTML = html; document.body.appendChild(tmp.firstElementChild);
}
function cancelCouponForm(){ var m=document.querySelector('.coupon-form-overlay'); if(m)m.remove(); editingCouponCode=null; }
function toggleBusinessPlanCouponFields(){var scope=document.getElementById('c-scope');var plans=document.getElementById('c-business-plans');if(scope&&plans)plans.classList.toggle('hidden',scope.value!=='business_plan');syncPromotionCouponFields();}
function syncPromotionCouponFields(){
  var auto=document.getElementById('c-auto'),first=document.getElementById('c-first-delivery'),scope=document.getElementById('c-scope'),once=document.getElementById('c-once');
  if(!auto||!first||!scope||!once)return;
  if(auto.checked)first.checked=true;
  if(first.checked){scope.value='delivery';once.checked=true;var plans=document.getElementById('c-business-plans');if(plans)plans.classList.add('hidden');}
  if(!first.checked)auto.checked=false;
}
function toDatetimeLocal(ts){ var d=new Date(ts); var pad=function(n){return n<10?'0'+n:n;}; var ms=String(d.getMilliseconds()).padStart(3,'0'); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+'.'+ms; }
function submitCoupon(code){
  var btn = document.getElementById("c-submit"); if(btn) btn.disabled = true;
  var body = {
    code: (document.getElementById("c-code").value||"").trim().toUpperCase(),
    title: (document.getElementById("c-title").value||"").trim(),
    value_type: document.querySelector('input[name="c-type"]:checked')?document.querySelector('input[name="c-type"]:checked').value:'percentage',
    value: Number(document.getElementById("c-value").value)||0,
    status: document.getElementById("c-status").value,
    applies_once_per_customer: !!document.getElementById("c-once").checked,
    scope: document.getElementById("c-scope").value,
    business_plan_ids: Array.from(document.querySelectorAll('input[name="c-plan"]:checked')).map(function(input){return input.value;}),
    auto_apply: !!document.getElementById("c-auto").checked,
    eligibility_rule: document.getElementById("c-first-delivery").checked ? "first_delivery" : null
  };
  var st = document.getElementById("c-starts").value;
  var en = document.getElementById("c-ends").value;
  var lim = document.getElementById("c-limit").value;
  if(st) body.starts_at = Date.parse(st);
  if(en) body.ends_at = Date.parse(en);
  if(lim!=='') body.usage_limit = Number(lim);
  if(!body.code) return alert("הזן קוד קופון"), btn.disabled=false;
  if(!body.title) return alert("הזן כותרת"), btn.disabled=false;
  if(body.value<0) return alert("הזן ערך תקין"), btn.disabled=false;
  if(body.eligibility_rule==="first_delivery"&&!en)return alert("להטבת משלוח ראשון חובה להגדיר מועד סיום"),btn.disabled=false;
  var url = code ? "/api/ops/coupons/"+code : "/api/ops/coupons";
  var method = code ? "PUT" : "POST";
  if(code) delete body.code;
  api(url,{method:method,body:JSON.stringify(body)}).then(async function(r){
    if(!r.ok){
      var msg = "שגיאה בשמירה";
      try { var j = await r.json(); if (j && j.error) msg = msg + ": " + j.error; } catch {}
      alert(msg);
      if(btn)btn.disabled=false; return;
    }
    cancelCouponForm(); refreshCoupons();
  }).catch(function(err){ alert("שגיאת רשת ("+(err&&err.message||"")+")"); if(btn)btn.disabled=false; });
}
async function deleteCoupon(code){
  if(!confirm("האם למחוק את הקופון "+code+"?")) return;
  var r = await api("/api/ops/coupons/"+code,{method:"DELETE"});
  if(r.ok){ refreshCoupons(); }
  else { alert("שגיאה במחיקה"); }
}

refresh();
setInterval(function(){
  if(podOrderId!==null)return;
  if(!(document.activeElement&&document.activeElement.tagName==="INPUT"))refresh();
},20000);
</script>
</body>
