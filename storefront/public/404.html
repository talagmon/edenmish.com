<!DOCTYPE html>
<html class="dark" dir="rtl" lang="he">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>EdenMish | העמוד לא נמצא</title>
<meta name="app-version" content="v0.28.0(293096)">
<meta name="description" content="העמוד שחיפשתם לא נמצא. אפשר לחזור לאתר EdenMish ולהמשיך משם."/>
<meta name="robots" content="noindex, nofollow"/>
<meta name="theme-color" content="#090d24"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link rel="icon" href="/assets/favicon.ico"/>
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png"/>
<style>
  :root {
    color-scheme: dark;
    --surface: #090d24;
    --surface-soft: rgba(17, 23, 53, 0.72);
    --outline: rgba(209, 218, 255, 0.16);
    --primary: #dfb7ff;
    --mint: #91d3c8;
    --text: #f6f2fb;
    --muted: #b8b3c7;
  }

  * { box-sizing: border-box; }

  body {
    min-height: 100dvh;
    margin: 0;
    overflow-x: hidden;
    background:
      radial-gradient(circle at 82% 10%, rgba(91, 42, 134, 0.34), transparent 35rem),
      radial-gradient(circle at 10% 90%, rgba(45, 226, 208, 0.12), transparent 28rem),
      linear-gradient(180deg, var(--surface), #0b1029 48%, var(--surface));
    color: var(--text);
    font-family: "Hanken Grotesk", system-ui, sans-serif;
  }

  .shell {
    width: min(calc(100% - 2rem), 1120px);
    min-height: 100dvh;
    margin-inline: auto;
    padding: 1.25rem 0 2rem;
    display: flex;
    flex-direction: column;
  }

  .brand {
    width: max-content;
    color: var(--primary);
    font-size: clamp(1.45rem, 4vw, 2rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    text-decoration: none;
  }

  .error-result {
    min-width: 0;
    margin-block: auto;
    padding-block: 2rem;
    display: grid;
    gap: 1.25rem;
  }

  .art,
  .message {
    min-width: 0;
    border: 1px solid var(--outline);
    border-radius: 1.6rem;
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.025));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 28px 90px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(24px) saturate(145%);
  }

  .art { position: relative; overflow: hidden; min-height: 245px; margin: 0; }
  .art::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 52%, rgba(11, 16, 32, 0.42));
    pointer-events: none;
  }
  .art img { width: 100%; height: 100%; min-height: 245px; object-fit: cover; display: block; }

  .message {
    padding: clamp(1.5rem, 6vw, 3.75rem);
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .status {
    width: fit-content;
    margin: 0 0 1.25rem;
    padding: 0.55rem 0.85rem;
    border: 1px solid rgba(223, 183, 255, 0.32);
    border-radius: 999px;
    background: rgba(91, 42, 134, 0.2);
    color: var(--primary);
    font-size: 0.9rem;
    font-weight: 700;
  }

  h1 {
    margin: 0;
    max-width: 12ch;
    font-size: clamp(2.25rem, 9vw, 4.7rem);
    line-height: 0.98;
    letter-spacing: -0.055em;
  }

  .lead {
    margin: 1.25rem 0 0;
    max-width: 35rem;
    color: var(--muted);
    font-size: clamp(1rem, 3.6vw, 1.2rem);
    line-height: 1.7;
  }

  .actions { margin-top: 1.5rem; display: grid; gap: 0.75rem; }
  .cta {
    min-height: 3.6rem;
    padding: 0.85rem 1.25rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.7rem;
    border: 1px solid transparent;
    border-radius: 1rem;
    font-size: 1.02rem;
    font-weight: 800;
    text-decoration: none;
    transition: transform 180ms ease, filter 180ms ease;
  }
  .cta.primary { background: linear-gradient(135deg, #5b2a86, #8066e8); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 16px 34px rgba(91,42,134,.28); }
  .cta.secondary { border-color: var(--outline); background: rgba(255, 255, 255, 0.035); color: var(--primary); }
  .cta:hover { filter: brightness(1.07); }
  .cta:active { transform: scale(0.985); }
  .cta:focus-visible { outline: 3px solid var(--primary); outline-offset: 4px; }
  footer { padding-top: 1rem; color: #898497; font-size: 0.8rem; text-align: center; }

  @media (min-width: 820px) {
    .shell { padding-top: 2rem; }
    .error-result {
      direction: ltr;
      grid-template-columns: minmax(0, 1.12fr) minmax(390px, 0.88fr);
      align-items: stretch;
    }
    .art, .art img, .message { min-height: 610px; }
    .message { direction: rtl; }
    .actions { grid-template-columns: repeat(2, max-content); }
    .cta { min-width: 12rem; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .art { animation: arrive 650ms ease both; }
    .message { animation: arrive 650ms 100ms ease both; }
    @keyframes arrive {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
  }
</style>
</head>
<body>
<div class="shell">
  <a class="brand" href="https://edenmish.com/" aria-label="EdenMish — דף הבית">EdenMish</a>

  <main class="error-result">
    <figure class="art">
      <img src="./assets/edenmish-payment-retry-bike.webp" width="1672" height="941" alt="אופנוע משלוחים ממתין ליד מסלול מואר שמוכן להמשך"/>
    </figure>

    <section class="message" aria-labelledby="not-found-title">
      <p class="status">שגיאה 404</p>
      <h1 id="not-found-title">העמוד לא נמצא</h1>
      <p class="lead">נראה שהכתובת השתנתה, שהעמוד הוסר או שפשוט פנינו בדרך הלא נכונה. אפשר לחזור לאחור או להמשיך בבטחה מהעמוד הראשי.</p>
      <div class="actions">
        <a class="cta primary" id="back-cta" href="https://edenmish.com/">חזרה לעמוד הקודם</a>
        <a class="cta secondary" href="https://edenmish.com/">לעמוד הראשי</a>
      </div>
    </section>
  </main>

  <footer>© 2026 EdenMish · משלוחים בגוש דן</footer>
</div>
<script>
  (() => {
    const back = document.getElementById('back-cta');
    back.addEventListener('click', event => {
      if (window.history.length <= 1) return;
      event.preventDefault();
      window.history.back();
      window.setTimeout(() => window.location.assign('https://edenmish.com/'), 1200);
    });
  })();
</script>
</body>
</html>
