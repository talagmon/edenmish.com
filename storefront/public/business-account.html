<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0F172A">
  <title>EdenMish | כניסה לחשבון העסקי</title>
<meta name="app-version" content="v0.28.0(293096)">
  <link rel="stylesheet" href="/assets/styles.css?v=0.28.0-293096-a8d8b91">
</head>
<body class="antialiased min-h-screen flex items-center justify-center p-6">
  <main class="glass-panel rounded-xl p-8 max-w-md text-center">
    <h1 class="text-headline-lg text-primary mb-3">החשבון העסקי של EdenMish</h1>
    <p class="text-on-surface-variant">מעבירים אתכם לכניסה המאובטחת…</p>
    <a id="continue" class="inline-block mt-5 bg-primary-container text-on-primary-container px-6 py-3 rounded-lg font-label-bold" href="#">להמשך</a>
  </main>
  <script src="/assets/api-origin.js"></script>
  <script>
    const allowedPlans=new Set(["trial","wallet","silver","gold","platinum"]);
    const requestedPlan=new URLSearchParams(window.location.search).get("plan");
    const target=new URL(window.EDEN_API.find+"/business");
    if(allowedPlans.has(requestedPlan))target.searchParams.set("plan",requestedPlan);
    document.getElementById("continue").href=target.toString();
    window.location.replace(target.toString());
  </script>
</body>
</html>
