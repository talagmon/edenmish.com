<!DOCTYPE html>
<html class="dark" dir="rtl" lang="he">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>EdenMish | תודה שבחרתם בנו</title>
<meta name="app-version" content="v0.30.1(293658)">
<meta name="description" content="התשלום ל-EdenMish התקבל בהצלחה. אנחנו ממשיכים לטפל בהזמנה ונשלח את פרטי ההמשך במייל."/>
<meta name="robots" content="noindex, nofollow"/>
<meta name="theme-color" content="#090d24"/>
<link rel="canonical" href="https://edenmish.com/thank-you.html"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link rel="icon" href="/assets/favicon.ico"/>
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png"/>
<link rel="stylesheet" href="/assets/site-nav.css" data-eden-site-nav-styles/>
<script src="/assets/api-origin.js" defer></script>
<script src="/assets/analytics.js" defer></script>
<style>
  :root {
    color-scheme: dark;
    --surface: #090d24;
    --surface-soft: rgba(17, 23, 53, 0.72);
    --outline: rgba(209, 218, 255, 0.16);
    --primary: #dfb7ff;
    --primary-strong: #5b2a86;
    --mint: #91d3c8;
    --text: #f6f2fb;
    --muted: #b8b3c7;
  }

  * { box-sizing: border-box; }

  body {
    min-height: 100dvh;
    margin: 0;
    overflow-x: hidden;
    background:
      radial-gradient(circle at 82% 10%, rgba(91, 42, 134, 0.34), transparent 35rem),
      radial-gradient(circle at 10% 90%, rgba(45, 226, 208, 0.12), transparent 28rem),
      linear-gradient(180deg, var(--surface), #0b1029 48%, var(--surface));
    color: var(--text);
    font-family: "Hanken Grotesk", system-ui, sans-serif;
  }

  .shell {
    width: min(calc(100% - 2rem), 1120px);
    min-height: 100dvh;
    margin-inline: auto;
    padding: 6.5rem 0 2rem;
    display: flex;
    flex-direction: column;
  }

  .brand {
    width: max-content;
    color: var(--primary);
    font-size: clamp(1.45rem, 4vw, 2rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    text-decoration: none;
  }

  .thank-you {
    min-width: 0;
    margin-block: auto;
    padding-block: 2rem;
    display: grid;
    gap: 1.25rem;
  }

  .art,
  .message {
    min-width: 0;
    border: 1px solid var(--outline);
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.025));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 28px 90px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(24px) saturate(145%);
  }

  .art {
    position: relative;
    overflow: hidden;
    min-height: 245px;
    margin: 0;
    border-radius: 1.6rem;
  }

  .art::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 48%, rgba(11, 16, 32, 0.42));
    pointer-events: none;
  }

  .art img {
    width: 100%;
    height: 100%;
    min-height: 245px;
    object-fit: cover;
    display: block;
  }

  .message {
    border-radius: 1.6rem;
    padding: clamp(1.5rem, 6vw, 3.75rem);
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .status {
    width: fit-content;
    margin: 0 0 1.25rem;
    padding: 0.55rem 0.85rem;
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    border: 1px solid rgba(145, 211, 200, 0.3);
    border-radius: 999px;
    background: rgba(145, 211, 200, 0.1);
    color: var(--mint);
    font-size: 0.9rem;
    font-weight: 700;
  }

  .status::before {
    content: "";
    width: 0.55rem;
    height: 0.55rem;
    border-radius: 50%;
    background: var(--mint);
    box-shadow: 0 0 18px rgba(145, 211, 200, 0.75);
  }

  h1 {
    margin: 0;
    max-width: 12ch;
    font-size: clamp(2.25rem, 9vw, 4.7rem);
    line-height: 0.98;
    letter-spacing: -0.055em;
  }

  .lead {
    margin: 1.25rem 0 0;
    max-width: 35rem;
    color: var(--muted);
    font-size: clamp(1rem, 3.6vw, 1.2rem);
    line-height: 1.7;
  }

  .next {
    margin: 1.5rem 0 0;
    padding: 1rem 1.1rem;
    border-radius: 1rem;
    background: rgba(255, 255, 255, 0.035);
    color: #d7d1df;
    font-size: 0.94rem;
    line-height: 1.55;
  }

  .home-cta {
    width: 100%;
    min-height: 3.6rem;
    margin-top: 1.5rem;
    padding: 0.85rem 1.25rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.7rem;
    border-radius: 1rem;
    border: 1px solid rgba(223, 183, 255, 0.5);
    background: linear-gradient(115deg, rgba(128, 73, 184, 0.52), rgba(91, 42, 134, 0.24)), rgba(30, 27, 72, 0.3);
    color: #fff;
    font-size: 1.02rem;
    font-weight: 800;
    text-decoration: none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18), inset 0 -1px 0 rgba(223,183,255,.08), 0 16px 38px rgba(9,8,29,.34), 0 0 28px rgba(139,92,246,.14);
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    transition: transform 180ms ease, filter 180ms ease;
  }

  .home-cta:hover { filter: brightness(1.07); }
  .home-cta:active { transform: scale(0.985); }
  .home-cta:focus-visible { outline: 3px solid var(--primary); outline-offset: 4px; }
  .home-cta span { direction: ltr; font-size: 1.35rem; }

  footer {
    padding-top: 1rem;
    color: #898497;
    font-size: 0.8rem;
    text-align: center;
  }

  @media (min-width: 820px) {
    .shell { padding-top: 2rem; }
    .thank-you {
      direction: ltr;
      grid-template-columns: minmax(0, 1.12fr) minmax(390px, 0.88fr);
      align-items: stretch;
    }
    .art { min-height: 610px; }
    .art img { min-height: 610px; }
    .message { min-height: 610px; direction: rtl; }
    .home-cta { width: fit-content; min-width: 15rem; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .art { animation: arrive 650ms ease both; }
    .message { animation: arrive 650ms 100ms ease both; }
    @keyframes arrive {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
  }
</style>
</head>
<body>
<header data-eden-site-nav></header>
<div class="shell">
  <main class="thank-you">
    <figure class="art">
      <img src="./assets/edenmish-thank-you-bike.webp" width="1672" height="941" alt="אופנוע משלוחים של EdenMish נוסע לאורך מסלול מואר בעיר"/>
    </figure>

    <section class="message" aria-labelledby="thank-you-title">
      <p class="status">התשלום התקבל בהצלחה</p>
      <h1 id="thank-you-title">תודה שבחרתם ב-EdenMish</h1>
      <p class="lead">אנחנו מעדכנים עכשיו את ההזמנה או החשבון שלכם. אישור ופרטי ההמשך יישלחו לכתובת האימייל שמסרתם.</p>
      <p class="next"><strong>מה עכשיו?</strong> אפשר לסגור את העמוד בבטחה או לחזור לאתר הראשי. אנחנו ממשיכים לטפל בכל השאר.</p>
      <a class="home-cta" href="https://edenmish.com/">
        <span aria-hidden="true">←</span>
        חזרה ל-edenmish.com
      </a>
    </section>
  </main>

  <footer>© 2026 EdenMish · משלוחים בגוש דן</footer>
</div>
<script src="/assets/mobile-nav.js" defer></script>
</body>
</html>
